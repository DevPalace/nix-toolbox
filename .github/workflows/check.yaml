name: Check

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  format:
    name: Format (nixfmt-rfc-style)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v30
      - run: nix fmt -- --check

  tests:
    name: OCI Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v30
      - run: nix flake check
